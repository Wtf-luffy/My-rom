name: Custom ROM Builder

on:
  workflow_dispatch: # Allows you to start the build manually with a button

jobs:
  build-rom:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean Up Server Space
      run: |
        docker rmi $(docker images -q)
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo apt-get clean
        df -h

    - name: Install Android Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Install Google Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Configure Git
      run: |
        git config --global user.name "Your Name"
        git config --global user.email "your-email@example.com"

    - name: Initialize ROM Source & Device Trees
      run: |
        mkdir android-source
        cd android-source
        # Example using LineageOS source. Swap this with your target ROM manifest.
        repo init -u https://github.com -b lineage-21.0 --git-lfs --depth=1
        
        # Create local manifest to pull Redmi Note 7 Pro ('violet' or 'lavender') trees
        mkdir -p .repo/local_manifests
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <!-- Replace these with the actual device tree, kernel, and vendor repositories for your specific device model -->
          <project name="LineageOS/android_device_xiaomi_violet" path="device/xiaomi/violet" remote="github" />
        </manifest>' > .repo/local_manifests/roomservice.xml
        
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Compile the Custom ROM
      run: |
        cd android-source
        source build/envsetup.sh
        lunch lineage_violet-userdebug
        mka bacon -j$(nproc --all)
        
